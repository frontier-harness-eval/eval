# harbor run -c job.yaml
job_name: hello-sum-oracle-vs-harness
jobs_dir: jobs
n_attempts: 1            # set >1 to get pass@k
n_concurrent_trials: 2
timeout_multiplier: 1.0
retry:
  max_retries: 0         # preserve the first attempt and its evidence
environment:
  type: docker           # local Docker; swap for daytona/modal/e2b/... to run remotely
  delete: true
agents:
  - name: oracle         # runs solution/solve.sh: proves the task + verifier work
  - import_path: my_agents.my_harness:MyHarness
    model_name: fireworks_ai/accounts/fireworks/models/kimi-k3
    env:
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}   # resolved from the host at setup
tasks:
  - path: tasks/hello-sum
datasets:
  - name: terminal-bench
    version: "2.0"
    task_names: [regex-log]
